{% extends "base.html" %}
{% load static %}
{% block title %}Registration{% endblock %}
{% block content %}
{% block extra_head %}
<link href="{% static 'regist.css' %}" rel="stylesheet">
<link href="{% static 'styles.css' %}" rel="stylesheet">
{% endblock %}

<div class="page">
  <div class="container">
    <div class="left">
      <div class="login">Register</div>
      <div class="eula">Register to continue using the schedule</div>
    </div>
    <div class="right">
      <form class="form" method="post">
        {% csrf_token %}
        <p>{{ form.username }}</p>
        <p>{{ form.email }}</p>
        <p>{{ form.password }}</p>
        <p><input class ="Registration" type="submit" value="Registration"></p>
      </form>
    </div>
  </div>
</div>
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="{% static 'animationweb.js' %}"></script>
{% endblock %}
